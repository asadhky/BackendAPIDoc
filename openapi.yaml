openapi: 3.0.0
info:
  version: 1.0.0
  title: Knowledge Graph API
  description: |
    The API documentation for the knowledge graph service: a backend that stores RDF
    graphs in a triple store, indexes them in Solr, and answers natural-language
    questions over them using Retrieval Augmented Generation (RAG).

    This is a **sanitized** specification. Hostnames, identifiers and payloads have been
    replaced with `example.org` placeholders; no internal servers or data are exposed.
  license:
    name: MIT
    url: https://github.com/asadhky/BackendAPIDoc/blob/main/LICENSE
  contact:
    name: Repository
    url: https://github.com/asadhky/BackendAPIDoc

servers:
  - url: http://localhost:3000/api
    description: Local development server
  - url: "{protocol}://{host}/api"
    description: Deployed instance
    variables:
      protocol:
        default: https
        enum: [https, http]
      host:
        default: localhost:3000
        description: Host and port of the deployment.

tags:
  - name: Administration
    description: Bulk loading, deletion and profile management for the triple store.
  - name: Configuration
    description: Read the service's current Solr configuration.
  - name: Resources
    description: Create, read and delete individual RDF resources.
  - name: File Management
    description: Upload RDF files and list what has been uploaded.
  - name: AI
    description: Retrieval Augmented Generation endpoints — answers, streaming answers and cards.
  - name: Solr
    description: Pass-through proxy to the underlying Solr API.
  - name: SPARQL
    description: Pass-through proxy for SPARQL queries against the triple store.

security:
  - BasicAuth: []
  - SessionAuth: []

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication.
    SessionAuth:
      type: apiKey
      in: cookie
      name: session-id
      description: Session identifier established when a session is created.

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Short, machine-readable error identifier.
          example: "Bad Request"
        message:
          type: string
          description: Human-readable explanation of what went wrong.
          example: "Required parameter 'query' is missing."
        status:
          type: integer
          description: HTTP status code.
          example: 400

    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable result of the operation.
          example: "loaded profiles"

    GraphIds:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          description: List of named graph IRIs available in the triple store.
          items:
            type: string
            format: uri
      example:
        ids:
          - "http://example.org/resource/graph-001"
          - "http://example.org/resource/graph-002"
          - "http://example.org/resource/dataset-alpha"
          - "http://example.org/resource/dataset-beta"

    SolrConfig:
      type: object
      description: The service's effective Solr configuration.
      properties:
        index:
          type: string
          example: "generic-index"
        crud:
          type: boolean
          example: true
        header:
          type: string
          example: ""
        rdfNamespace:
          type: string
          example: "http://example.org/"
        solrRegex:
          type: string
          example: "[\\/*?\"<>|#:.\\- ]"
        solrRegexReplacement:
          type: string
          example: "_"
        solrMaxAggregations:
          type: integer
          example: 1000
        geoDataType:
          type: string
          example: "http://www.opengis.net/ont/geosparql#wktLiteral"
        shapes:
          type: string
          example: "<https://example.org/resource/1234> <https://schema.org/relation> <https://example.org/resource/5678> ..."
        rootShapes:
          type: array
          items:
            type: string
          example:
            - "https://example.org/shapes/main-profile"
            - "https://example.org/shapes/secondary-profile"

    UploadedFile:
      type: object
      properties:
        filename:
          type: string
          description: Name of the uploaded file.
          example: "data-import-01.ttl"
        graph:
          type: string
          description: Graph IRI associated with the file.
          example: "http://example.org/resource/import-01"
        size:
          type: integer
          description: Size of the file in bytes.
          example: 1024

    UploadedFiles:
      type: object
      required: [files]
      properties:
        files:
          type: array
          description: List of uploaded RDF files with metadata.
          items:
            $ref: '#/components/schemas/UploadedFile'
      example:
        files:
          - filename: "data-import-01.ttl"
            graph: "http://example.org/resource/import-01"
            size: 1024
          - filename: "data-import-02.ttl"
            graph: "http://example.org/resource/import-02"
            size: 2048

    GenerateResponse:
      type: object
      required: [generate, session-id]
      properties:
        generate:
          type: string
          description: The generated answer.
        session-id:
          type: string
          description: Echo of the session identifier supplied in the request.
        context:
          type: array
          description: IRIs of the resources the answer was grounded in.
          items:
            type: string
            format: uri
      example:
        generate: "The project is currently in the development phase."
        session-id: "abc123-session-token"
        context:
          - "http://example.org/resource/project-status"
          - "http://example.org/resource/timeline"

    Card:
      type: object
      required: [title, subtitle, picture, type]
      properties:
        title:
          type: string
          description: Primary heading of the card.
          example: "Sample Resource Title"
        subtitle:
          type: string
          description: Secondary descriptive line.
          example: "Brief description or subtitle of the item"
        picture:
          type: string
          format: uri
          description: URL to a thumbnail or illustrative image.
          example: "https://example.org/images/sample-thumbnail.jpg"
        type:
          type: string
          description: Domain/type classification of the card.
          example: "CreativeWork"
        score:
          type: number
          format: float
          description: Relevance score (optional).
          example: 0.95
        reference:
          type: string
          format: uri
          description: Knowledge graph IRI or canonical resource identifier.
          example: "http://example.org/resource/item-001"
        snippet:
          type: string
          description: Short textual snippet or highlight.
          example: "This is a key highlight or excerpt related to the resource."
        extra:
          type: object
          additionalProperties: true
          description: Arbitrary additional metadata.
          example:
            creationDate: "2024-01-01"
            status: "active"

    CardsResponse:
      type: object
      required: [session-id, cards]
      properties:
        session-id:
          type: string
          description: Echo of the session identifier supplied in the request.
        cards:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/Card'

  responses:
    BadRequest:
      description: The request was malformed, or a required parameter was missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Bad Request"
            message: "Required parameter 'query' is missing."
            status: 400
    Unauthorized:
      description: Authentication is required, or the supplied credentials were rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Unauthorized"
            message: "Valid credentials or an active session are required."
            status: 401
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Not Found"
            message: "No resource with the given identifier was found."
            status: 404
    ServerError:
      description: The service failed while handling the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Internal Server Error"
            message: "The triple store could not be reached."
            status: 500

paths:
  /v1/ids:
    get:
      summary: Get all named graph IDs
      description: |
        Retrieves all named graph identifiers from the triple store.
      operationId: getAllIDs
      tags:
        - Administration
      responses:
        '200':
          description: Successfully retrieved list of all graph IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphIds'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/load_all:
    post:
      summary: Load all named graphs from RDF files
      description: |
        Loads all Turtle (.ttl) RDF files from the data/rdf directory into the triple store.
        This endpoint scans the local directory, parses each .ttl file, stores/updates
        the graphs in the database, and indexes them in Solr.
      operationId: loadAllNamedGraphs
      tags:
        - Administration
      responses:
        '200':
          description: Successfully loaded all RDF graphs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: "loaded 12 graphs"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/fetch_profiles:
    get:
      summary: Fetch SHACL profiles
      description: |
        Downloads SHACL (Shapes Constraint Language) profiles from the configured remote source and saves them to the local data/shacl directory.
        SHACL profiles are used for validating RDF data.
      operationId: fetchProfiles
      tags:
        - Administration
      responses:
        '200':
          description: Successfully fetched and loaded SHACL profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: "loaded profiles"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/delete_all:
    post:
      summary: Delete all named graphs
      description: Removes all graphs from the triple store and clears the index.
      operationId: deleteAllGraphs
      tags:
        - Administration
      responses:
        '200':
          description: All graphs deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: "all graphs deleted"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/config:
    get:
      summary: Get Solr configuration
      description: Retrieves the current Solr configuration settings.
      operationId: getConfig
      tags:
        - Configuration
      responses:
        '200':
          description: Successfully retrieved Solr configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolrConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/resource/{resource_id}:
    get:
      summary: Get RDF resource by ID
      description: Retrieves a specific RDF resource in Turtle format from the triple store.
      operationId: getResource
      tags:
        - Resources
      parameters:
        - name: resource_id
          in: path
          required: true
          description: The unique identifier (URI) of the RDF resource to retrieve.
          schema:
            type: string
          example: "http://example.org/resource/sample-item-01"
      responses:
        '200':
          description: Resource retrieved successfully
          content:
            application/x-turtle:
              schema:
                type: string
                description: Turtle-formatted RDF data of the requested resource
              example: |
                @prefix dcterms: <http://purl.org/dc/terms/> .
                @prefix ns1: <http://schema.org/> .
                @prefix xsd: <http://www.w3.org/2001/XMLSchema#> .

                <http://example.org/resource/sample-item-01> a ns1:Thing ;
                    dcterms:conformsTo <https://example.org/profiles/generic-profile> ;
                    ns1:name "Sample Resource Name"@en ;
                    ns1:description "A generic description of the resource."@en ;
                    ns1:identifier "ID-12345" ;
                    ns1:dateCreated "2024-01-01"^^xsd:date .
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      summary: Delete resource by ID
      description: Removes a specific RDF resource from the triple store.
      operationId: deleteResource
      tags:
        - Resources
      parameters:
        - name: resource_id
          in: path
          required: true
          description: Resource ID to be deleted.
          schema:
            type: string
          example: "http://example.org/resource/sample-item-01"
      responses:
        '200':
          description: Resource deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: "graph <http://example.org/resource/sample-item-01> deleted"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/resource:
    post:
      summary: Add new RDF resource
      description: Adds a new RDF graph to the triple store.
      operationId: addResource
      tags:
        - Resources
      requestBody:
        required: true
        description: The Turtle-serialised RDF graph to store.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - ttl
              properties:
                ttl:
                  type: string
                  description: Turtle format RDF data.
            example:
              ttl: "<http://example.org/newResource> a <http://example.org/Type> ."
      responses:
        '201':
          description: Resource created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: "new graph <http://example.org/newResource> added"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/upload:
    get:
      summary: Get all uploaded RDF files
      description: |
        Retrieves a list of all RDF files that have been uploaded to the system.
        Returns metadata about each uploaded RDF file including graph information.
      operationId: getUploadedFiles
      tags:
        - File Management
      responses:
        '200':
          description: Successfully retrieved list of uploaded RDF files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFiles'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      summary: Upload RDF file
      description: |
        Uploads a new RDF file to the system. The file will be parsed, stored in the triple store,
        and indexed for search. Supports Turtle (.ttl) format RDF files.
      operationId: uploadRdfFile
      tags:
        - File Management
      requestBody:
        required: true
        description: Multipart form containing the Turtle file to upload.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - graph_file
              properties:
                graph_file:
                  type: string
                  format: binary
                  description: RDF file in Turtle format (.ttl).
      responses:
        '201':
          description: RDF file successfully uploaded and processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: "upload.ttl uploaded and indexed"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/generate:
    get:
      summary: Generate answer using RAG
      description: |
        Generates answers using Retrieval Augmented Generation (RAG).
        Provide a query string and receive a generated answer along with context.
      operationId: generateAnswer
      tags:
        - AI
      parameters:
        - name: query
          in: query
          required: true
          description: Query string for the RAG system.
          schema:
            type: string
          example: "What is the status of the project?"
        - name: session-id
          in: query
          required: true
          description: Identifier for the user session.
          schema:
            type: string
          example: "abc123-session-token"
      responses:
        '200':
          description: Answer generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/generate_stream:
    get:
      summary: Stream generated answers using RAG
      description: |
        Generates answers using Retrieval Augmented Generation (RAG) with real-time streaming.
        This endpoint provides a streaming response that returns chunks of text as they are generated.
      operationId: generateStream
      tags:
        - AI
      parameters:
        - name: query
          in: query
          required: true
          description: The query or prompt for which to generate an answer.
          schema:
            type: string
          example: "Summarise what the knowledge graph says about the project."
      responses:
        '200':
          description: |
            The response is streamed as server-sent events. Each `token` event carries the
            next chunk of the answer; a final `references` event carries the sources, and
            the stream closes with `done`.
          content:
            text/event-stream:
              schema:
                type: string
                description: A server-sent event stream.
              example: |
                event: token
                data: {"text": "### Summary of Query"}

                event: token
                data: {"text": "\n\nThis is a generated response based on the "}

                event: token
                data: {"text": "knowledge graph data..."}

                event: references
                data: {"references": ["[KG] http://example.org/resource/reference-1", "[KG] http://example.org/resource/reference-2"]}

                event: done
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/cards:
    get:
      summary: Get cards for a query
      description: |
        Retrieves a set of "cards" or summarized information snippets relevant to the provided query.
      operationId: generateCards
      tags:
        - AI
      parameters:
        - name: query
          in: query
          required: true
          description: Query string the cards should be relevant to.
          schema:
            type: string
          example: "sample items in category A"
        - name: session-id
          in: query
          required: true
          description: Identifier for the user session.
          schema:
            type: string
          example: "abc123-session-token"
      responses:
        '200':
          description: Cards generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardsResponse'
              examples:
                sample:
                  summary: Two sample cards
                  value:
                    session-id: "abc123-session-token"
                    cards:
                      - title: "Sample Item Alpha"
                        subtitle: "A description of the first item"
                        picture: "https://example.org/images/alpha.jpg"
                        type: "Category A"
                        score: 0.95
                        reference: "http://example.org/resource/alpha"
                        snippet: "This is a key detail about Item Alpha."
                        extra:
                          created: "2023-01-01"
                      - title: "Sample Item Beta"
                        subtitle: "A description of the second item"
                        picture: "https://example.org/images/beta.jpg"
                        type: "Category B"
                        score: 0.88
                        reference: "http://example.org/resource/beta"
                        snippet: "This is a key detail about Item Beta."
                        extra:
                          status: "archived"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/solr/{collection}/{action}:
    parameters:
      - name: collection
        in: path
        required: true
        description: Solr collection name.
        schema:
          type: string
        example: "rdf"
      - name: action
        in: path
        required: true
        description: Solr API endpoint.
        schema:
          type: string
        example: "select"

    get:
      summary: Proxy GET request to Solr API
      description: |
        Forwards GET requests to Solr with query parameters.
        Supports standard Solr query parameters and returns the Solr response directly.
      operationId: solrProxyGet
      tags:
        - Solr
      responses:
        '200':
          description: Successfully retrieved data from Solr
          content:
            application/json:
              schema:
                type: object
                description: The Solr response, forwarded unchanged.
                additionalProperties: true
              example:
                responseHeader:
                  zkConnected: true
                  status: 0
                  QTime: 5
                  params:
                    q: "*:*"
                    wt: "json"
                response:
                  numFound: 2
                  start: 0
                  numFoundExact: true
                  docs:
                    - id: "http%3A//example.org/resource/doc-1"
                      _rdf: "@prefix ns1: <http://schema.org/> .\n\n<http://example.org/resource/doc-1> a ns1:Thing ; ns1:name \"Document 1\" ."
                      _shape: "https://example.org/profiles/shape-1"
                      _version_: 1800000000000000000
                      _root_: "http%3A//example.org/resource/doc-1"
                    - id: "http%3A//example.org/resource/doc-2"
                      _rdf: "@prefix ns1: <http://schema.org/> .\n\n<http://example.org/resource/doc-2> a ns1:Thing ; ns1:name \"Document 2\" ."
                      _shape: "https://example.org/profiles/shape-2"
                      _version_: 1800000000000000001
                      _root_: "http%3A//example.org/resource/doc-2"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      summary: Proxy POST to Solr API
      description: |
        Forwards POST requests to Solr. Used for updates or committing changes,
        for example `POST /api/v1/solr/rdf/update?commit=true`.
      operationId: solrProxyPost
      tags:
        - Solr
      parameters:
        - name: commit
          in: query
          required: false
          description: If true, commits changes after the update.
          schema:
            type: boolean
          example: true
      responses:
        '200':
          description: Successful Solr response
          content:
            application/json:
              schema:
                type: object
                description: The Solr response, forwarded unchanged.
                additionalProperties: true
              example:
                responseHeader:
                  status: 0
                  QTime: 4
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/sparql/query:
    get:
      summary: Execute SPARQL query (GET)
      description: |
        Proxies SPARQL SELECT and ASK queries to the triple store using HTTP GET.
        This endpoint forwards the query parameters and returns the results.
      operationId: executeSparqlGet
      tags:
        - SPARQL
      parameters:
        - name: query
          in: query
          required: true
          description: |
            SPARQL query string. Must be URL-encoded.
          schema:
            type: string
          example: "SELECT * WHERE { ?s ?p ?o } LIMIT 1"
      responses:
        '200':
          description: Successful SPARQL query execution
          content:
            application/json:
              schema:
                type: object
                description: SPARQL 1.1 Query Results JSON Format.
                additionalProperties: true
              example:
                head:
                  vars: ["s", "p", "o"]
                results:
                  bindings:
                    - s:
                        type: "uri"
                        value: "http://example.org/resource-1"
                      p:
                        type: "uri"
                        value: "http://www.w3.org/1999/02/22-rdf-syntax-ns#type"
                      o:
                        type: "uri"
                        value: "http://example.org/TypeClass"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      summary: Execute SPARQL query (POST)
      description: |
        Proxies SPARQL queries to the triple store using HTTP POST.
        This method is recommended for complex queries, updates, and large result sets.
      operationId: executeSparqlPost
      tags:
        - SPARQL
      requestBody:
        required: true
        description: Form-encoded SPARQL query.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: SPARQL query string.
                  example: "SELECT * WHERE { ?s ?p ?o } LIMIT 1"
      responses:
        '200':
          description: Successful SPARQL query execution
          content:
            application/json:
              schema:
                type: object
                description: SPARQL 1.1 Query Results JSON Format.
                additionalProperties: true
              example:
                head:
                  vars: ["s", "p", "o"]
