<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Knowledge Graph API — Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5/favicon-16x16.png" sizes="16x16" />
    <style>
      html { box-sizing: border-box; overflow: -moz-scrollbars-vertical; overflow-y: scroll; }
      *, *:before, *:after { box-sizing: inherit; }
      body { margin: 0; background: #fafafa; }
      .banner {
        font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.5;
        padding: 10px 20px; background: #f3f4f6; border-bottom: 1px solid #e5e7eb; color: #374151;
      }
      .banner strong { color: #111827; }
      .banner a { color: #2563eb; }
    </style>
  </head>
  <body>
    <div class="banner">
      <strong>Sample specification.</strong>
      No live server backs this spec, so "Try it out" is disabled.
      <a href="./index.html">Reference view</a> ·
      <a href="https://github.com/asadhky/BackendAPIDoc">Source on GitHub</a>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <script>
      window.onload = function() {
        window.ui = SwaggerUIBundle({
          url: "./openapi.yaml",
          dom_id: '#swagger-ui',
          deepLinking: true,
          docExpansion: 'list',
          supportedSubmitMethods: [],
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl],
          layout: "StandaloneLayout"
        });
      };
    </script>
  </body>
</html>
